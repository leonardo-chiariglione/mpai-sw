<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thalia</title>
<link rel="icon" href="/thalia-icon.svg" type="image/svg+xml">
<link rel="icon" href="/thalia.ico" sizes="16x16 32x32 48x48 256x256">
<link rel="manifest" href="/thalia.webmanifest">
<style>
  :root { --rail:200px; --ink:#f1f4fa; --muted:#b9c2d4; --line:rgba(255,255,255,.18); --panel:rgba(14,18,28,.62); --panel2:rgba(14,18,28,.80); --accent:#9db9ff; --ok:#6fe0a8; --warn:#f3c06a; --bad:#ff8a8d; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { color:var(--ink); font:15px/1.45 "Segoe UI", system-ui, sans-serif; background:#10141c center/cover no-repeat fixed; overflow:hidden; }
  body::before { content:""; position:fixed; inset:0; background:rgba(8,11,18,.28); pointer-events:none; }
  .shell { position:relative; height:calc(100vh - var(--covered, 0px)); display:grid; grid-template-rows:auto auto 1fr; }
  /* THE DEVICE BAR: Thalia says when it has no microphone of its own, or when one comes or goes, and offers the buttons to set it */
  .devbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:8px 22px; background:rgba(243,192,106,.22); border-bottom:1px solid var(--line); font-size:14px; backdrop-filter:blur(10px); }
  .devbar[hidden] { display:none; } .devbar .act.secondary { color:var(--ink); border-color:var(--ink); background:rgba(14,18,28,.45); } .devbar .msg { flex:1; min-width:240px; } .devbar .lvl { width:120px; height:8px; border-radius:4px; background:rgba(255,255,255,.15); overflow:hidden; } .devbar .lvl div { height:100%; width:0; background:var(--ok); }
  .top { display:flex; align-items:center; gap:14px; padding:12px 22px; background:var(--panel); border-bottom:1px solid var(--line); backdrop-filter:blur(10px); }
  .top h1 { margin:0; font-size:22px; font-weight:600; letter-spacing:.5px; }
  .top .sub { color:var(--muted); font-size:13px; }
  .top .space { flex:1; }
  .body { display:grid; grid-template-columns:var(--rail) 1fr; min-height:0; }
  .rail { padding:14px 10px; background:var(--panel); border-right:1px solid var(--line); backdrop-filter:blur(10px); display:flex; flex-direction:column; gap:4px; }
  .rail button { all:unset; cursor:pointer; padding:8px 12px; border-radius:8px; color:var(--muted); }
  .rail button.on { background:rgba(157,185,255,.2); color:var(--ink); }
  .body.flip { grid-template-columns:1fr var(--rail); } .flip .rail { order:3; border-right:0; border-left:1px solid var(--line); } .flip .content { order:1; margin-left:0; margin-right:auto; }
  /* THE STAGE: an App Thalia runs is shown between the rail and the functions, with a bar to stop it. */
  .stage { display:none; order:2; min-width:0; min-height:0; margin:12px; flex-direction:column; border:1px solid var(--line); border-radius:12px; background:var(--panel2); overflow:hidden; backdrop-filter:blur(10px); }
  .content { order:3; } .flip .content { order:1; }
  .body.playing { grid-template-columns:var(--rail) 1fr min(560px, 36%); } .body.flip.playing { grid-template-columns:min(560px, 36%) 1fr var(--rail); }
  .body.playing .stage { display:flex; } .body.playing .content { width:100%; margin:0; }
  body:has(.body.playing) .credit { display:none; }
  .stagebar { display:flex; align-items:center; gap:10px; padding:8px 12px; border-bottom:1px solid var(--line); background:var(--panel); }
  .stagebar img { width:28px; height:28px; } .stagebar b { font-size:15px; } .stagebar .space { flex:1; }
  .stagebar .tabs { display:flex; gap:6px; } .stagebar .tabs button { all:unset; cursor:pointer; font-size:12px; padding:3px 9px; border-radius:20px; border:1px solid var(--line); color:var(--muted); }
  .stagebar .tabs button:hover { border-color:var(--accent); color:var(--ink); }
  .stbody { position:relative; flex:1; min-height:0; }
  .stbody iframe { position:absolute; inset:0; width:100%; height:100%; border:0; background:#10141c; }
  .stmsg { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:24px; text-align:center; color:var(--muted); }
  .stmsg[hidden] { display:none; } .stmsg h3 { margin:0; color:var(--ink); font-size:19px; font-weight:600; } .stmsg .bad { color:var(--bad); }
  /* only a message on the stage (the App has a window of its own, or is starting): the picture stays sharp behind it, and the message is a card */
  .stage.msgonly { background:transparent; backdrop-filter:none; border-color:transparent; } .stage.msgonly .stbody { background:transparent; }
  .stage.msgonly .stagebar { border-radius:12px; border:1px solid var(--line); background:var(--panel2); backdrop-filter:blur(10px); }
  .stmsg .note { max-width:440px; padding:22px 28px; border-radius:14px; background:var(--panel2); border:1px solid var(--line); backdrop-filter:blur(10px); display:flex; flex-direction:column; align-items:center; gap:10px; }
  .stmsg .note img { width:64px; height:64px; } .stmsg .note p { margin:0; color:var(--muted); }
  .stmsg .note { max-width:640px; } .stmsg pre.said { align-self:stretch; margin:4px 0 0; padding:10px 12px; border-radius:8px; background:rgba(0,0,0,.35); color:var(--ink); font:12.5px/1.45 Consolas, monospace; text-align:left; white-space:pre-wrap; word-break:break-all; }
  .stmsg pre.said[hidden] { display:none; }
  .stmsg .note.results { max-height:calc(100% - 40px); overflow:auto; width:min(640px, 100%); align-items:stretch; } .stmsg .note.results img:first-child, .stmsg .note.results h3, .stmsg .note.results .where { align-self:center; }
  .stmsg .results .where { font-size:12.5px; word-break:break-all; text-align:center; } .stmsg .files { display:flex; flex-direction:column; gap:10px; text-align:left; }
  .stmsg .file { border-top:1px solid var(--line); padding-top:8px; display:flex; flex-direction:column; gap:6px; } .stmsg .fname { display:flex; justify-content:space-between; align-items:center; gap:10px; color:var(--ink); font-size:13.5px; word-break:break-all; }
  .stmsg .file audio { width:100%; } .stmsg .results .buttons { display:flex; gap:8px; justify-content:center; }
  .content { scrollbar-color:rgba(255,255,255,.35) transparent; scrollbar-width:thin; padding:18px 24px 24px; overflow:auto; width:min(600px, 100%); margin-left:auto; padding-bottom:24px; }   /* a column on the right: the abbey, left of centre in the pictures, stays visible */
  .searchbar { display:flex; gap:12px; align-items:center; margin-bottom:6px; }
  .searchbar[hidden] { display:none; }
  input[type=search] { flex:1; font:inherit; padding:9px 14px; border-radius:9px; border:1px solid var(--line); background:var(--panel2); color:var(--ink); }
  input[type=search]::placeholder { color:var(--muted); }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; background:var(--panel2); }
  .seg span { padding:8px 13px; cursor:pointer; color:var(--muted); font-size:13px; white-space:nowrap; }
  .seg span.on { background:rgba(157,185,255,.25); color:var(--ink); }
  .notice { margin:10px 0; padding:9px 14px; border-radius:8px; background:rgba(243,192,106,.2); font-size:13px; }
  h2.sec { font-size:13px; font-weight:600; color:var(--muted); margin:18px 0 8px; text-transform:none; }
  .grid { display:grid; grid-template-columns:1fr; gap:12px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; display:flex; flex-direction:column; gap:9px; backdrop-filter:blur(10px); }
  .head { display:flex; gap:12px; align-items:center; }
  .head img { width:42px; height:42px; }
  .head h3 { margin:0; font-size:17px; }
  .head .id { color:var(--muted); font-size:12px; }
  .desc { color:var(--muted); font-size:14px; margin:0; }
  .where { border-top:1px solid var(--line); padding-top:9px; display:grid; grid-template-columns:104px 1fr; gap:6px 10px; align-items:center; }
  .label { font-weight:600; font-size:13px; }
  .status { font-size:13px; color:var(--muted); }
  .status.ok { color:var(--ok); } .status.bad { color:var(--bad); } .status.busy { color:var(--warn); }
  .buttons { grid-column:2; display:flex; gap:8px; flex-wrap:wrap; }
  button.act, a.btn { font:inherit; font-size:13px; padding:5px 14px; border-radius:7px; border:1px solid var(--accent); background:var(--accent); color:#0d1422; cursor:pointer; text-decoration:none; }
  button.act.secondary { background:transparent; color:var(--accent); }
  button.act:disabled { opacity:.4; cursor:default; }
  details { font-size:12.5px; color:var(--muted); }
  details summary { cursor:pointer; } details ul { margin:6px 0 0; padding-left:18px; }
  .empty { color:var(--muted); padding:20px 0; }
  .tbl { width:100%; border-collapse:collapse; font-size:12px; margin-top:6px; } .tbl th { text-align:left; color:var(--muted); font-weight:600; padding:3px 8px 3px 0; } .tbl td { padding:3px 8px 3px 0; border-top:1px solid var(--line); vertical-align:top; }
  .chip.update { color:var(--warn); border-color:var(--warn); } .chip.obtained, .chip.bundled { color:var(--ok); border-color:var(--ok); }
  .storebar { display:flex; gap:10px; align-items:center; margin-bottom:10px; } .storebar input { flex:1; }
  .detail { border-top:1px solid var(--line); padding-top:10px; display:flex; flex-direction:column; gap:8px; font-size:13px; } .detail h4 { margin:6px 0 2px; font-size:12.5px; color:var(--muted); font-weight:600; }
  .detail label { display:flex; gap:8px; align-items:flex-start; color:var(--ink); } .detail .msg { padding:8px 12px; border-radius:8px; background:rgba(120,200,140,.18); } .detail .msg.bad { background:rgba(240,120,120,.2); }

  .seasons { display:flex; gap:6px; margin-right:8px; }
  .seasons button { all:unset; cursor:pointer; width:54px; height:32px; border-radius:7px; border:2px solid var(--line); background:center/cover #222; color:var(--ink); font-size:12px; text-align:center; line-height:28px; }
  .seasons button:hover { border-color:var(--muted); } .seasons button.on { border-color:var(--accent); } .seasons button.picked { outline:2px dashed var(--accent); outline-offset:1px; }
  .soon { font-size:10px; margin-left:4px; padding:1px 6px; border-radius:20px; border:1px solid var(--line); color:var(--muted); }
  .enables { margin:4px 0 0; padding-left:18px; color:var(--ink); } .enables li { margin:5px 0; } .enables li span { color:var(--muted); }
  .fn { gap:4px; padding:11px 14px; } .fn .fh { display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .chip { font-size:11px; padding:2px 9px; border-radius:20px; border:1px solid var(--line); color:var(--muted); }
  .fn.available .chip { color:var(--ok); border-color:var(--ok); } .fn.coming { opacity:.8; }
  .ret { font:inherit; font-size:13px; padding:6px 14px; border-radius:8px; border:1px solid var(--line); background:var(--panel2); color:var(--ink); cursor:pointer; }
  .ret:hover { border-color:var(--accent); }
  .dock { margin-top:auto; display:flex; flex-direction:column; align-items:center; gap:8px; padding:12px 4px 4px; border-top:1px solid var(--line); }
  /* THE LADY'S PLACE (2026-11-25, the author): immediately below the menu - her face, Voice and Text below it, what was heard and what she answered below them; the MPAI card at the
     bottom of the pane. An App that has her (ASM) puts its own lady, with its Voice, Text and words, in this place. */
  .slot { flex:1; min-height:0; display:flex; flex-direction:column; align-items:center; gap:8px; margin-top:10px; padding:10px 2px 0; border-top:1px solid var(--line); }
  .slot .talk { align-self:stretch; flex:1; min-height:60px; overflow:auto; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:var(--panel2); font-size:12.5px; }
  .slot .talk b { display:block; color:var(--ink); font-weight:600; } .slot .talk div { color:var(--muted); margin:2px 0 6px; min-height:1.2em; }
  .rail .dock button.logo { width:100%; padding:6px 10px; background:#fff; border:2px solid transparent; border-radius:10px; cursor:pointer; }
  .rail .dock button.logo img { display:block; height:46px; margin:0 auto; }
  .rail .dock button.logo:hover, .rail .dock button.logo.on { border-color:var(--accent); }
  .face { width:104px; height:104px; border-radius:50%; object-fit:cover; border:2px solid var(--line); background:#222; transition:opacity .25s; }
  /* THALIA MOVES INTO THE APP: while an App that has her runs on the stage, her face leaves the corner (a picture of her flies to the App and back) */
  .face.away { opacity:0; }
  .flyface { position:fixed; z-index:50; border-radius:50%; object-fit:cover; border:2px solid var(--accent); pointer-events:none; transition:left .7s ease-in-out, top .7s ease-in-out, width .7s ease-in-out, height .7s ease-in-out, opacity .7s ease-in; }
  .slot .name { font-size:13px; color:var(--muted); margin-top:-4px; }
  .sw { width:100%; display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .sw button { all:unset; cursor:pointer; text-align:center; font-size:12.5px; padding:6px 4px; border-radius:8px; border:1px solid var(--line); color:var(--muted); }
  /* red: not enabled; blue: enabled (as in the Apps) */
  .sw button { background:#b3261e; color:#fff; border-color:#b3261e; font-weight:600; } .sw button:disabled { cursor:default; }
  .sw button:not(:disabled) { background:#1d3f9e; border-color:#1d3f9e; }
  body:has(.body.flip) .credit { left:12px; }
  .ack { font-size:10.5px; line-height:1.3; color:var(--muted); text-align:center; }
  .credit { position:fixed; left:calc(var(--rail) + 12px); bottom:8px; font-size:11px; color:rgba(255,255,255,.75); text-shadow:0 1px 2px #000; max-width:calc(100% - 230px); }
  .credit a { color:inherit; }
  @media (max-width:700px) { .body { grid-template-columns:1fr; } .rail { display:none; } .content { padding-bottom:230px; } }
</style>
</head>
<body>
<div class="shell">
  <div class="top">
    <h1>Thalia</h1><span class="sub" id="machine"></span><span class="space"></span>
    <div class="seasons" id="seasons" role="group" aria-label="Season of the picture"></div>
    <button class="ret" id="flip" title="Put the functions on the other side of the picture">Swap sides</button>
    <button class="ret" id="full" title="Fill the screen">Full screen</button>
    <button class="ret" id="ret" title="Hide Thalia: it keeps running">Return to Windows</button>
    <button class="ret" id="quit" title="End Thalia, and the Apps it started">Close</button>
  </div>
  <div class="devbar" id="devbar" hidden role="status"><span class="msg" id="devmsg"></span><span class="lvl" id="devlvl" hidden><div></div></span><span class="buttons" id="devbtns" style="display:flex;gap:8px"></span></div>
  <div class="body">
    <nav class="rail"><button class="on" data-view="home">Home</button><button data-view="apps">Apps</button><button data-view="running">Running</button><button data-view="devices">Devices</button><button data-view="settings">Settings</button>
<div class="slot" id="faceSlot" aria-label="Thalia">
  <img class="face" src="/thalia.png?v=2" alt="Thalia">
  <div class="name">Thalia</div>
  <div class="sw" id="sw"><button disabled title="Coming: Thalia listens to you">Voice</button><button title="Thalia is used by writing and pressing">Text</button></div>
  <div class="talk"><b>What I heard:</b><div id="heard"></div><b>What she answered:</b><div id="answered"></div></div>
  <div class="ack">Avatar by Ready Player Me (CC BY-NC-SA 4.0), used for demonstration. Other uses are subject to restrictions.</div>
</div>
<aside class="dock" aria-label="MPAI">
  <button data-view="about" class="logo" title="About MPAI: a video that tells what MPAI proposes" aria-label="About MPAI"><img src="/mpai-logo.png" alt="About MPAI"></button>
</aside>
    </nav>
    <section class="stage" id="stage" aria-label="The App that is running">
      <div class="stagebar">
        <img id="stIcon" alt=""><div><b id="stName"></b> <span class="status" id="stWhere"></span></div><span class="status" id="stPhase"></span><span class="space"></span>
        <span class="tabs" id="stOthers" title="Other Apps that are running: show one here"></span>
        <button class="act secondary" id="stHide" title="The App keeps running: show it again from Running or from its card">Hide</button>
        <button class="act" id="stStop" title="Stop the App: Thalia ends it and what it started">Stop</button>
      </div>
      <div class="stbody"><iframe id="stFrame" title="The App" allow="microphone; camera; autoplay; fullscreen; display-capture; clipboard-read; clipboard-write"></iframe><div class="stmsg" id="stMsg"></div></div>
    </section>
    <main class="content">
      <div class="searchbar">
        <input type="search" id="q" placeholder="Search Apps" autocomplete="off">
        <div class="seg" id="scope"><span data-s="local">This machine</span><span data-s="store">MPAI Store</span><span data-s="mas">MPAI as a Service</span></div>
      </div>
      <div class="notice" id="notice" hidden></div>
      <div id="view"></div>
    </main>
  </div>
</div>
<div class="credit" id="credit"></div>
<script src="mpai-units.js"></script>
<script>
// ABOVE THE TASKBAR (2026-11-25): the window of Thalia fills the screen, and the taskbar of Windows stays over its bottom - the MPAI card at the foot of the pane was half under it. The
// part of the window the taskbar covers (the screen less its work area) is left out of the page.
function keepAboveTaskbar() {
  const bottom = (screen.availTop || 0) + screen.availHeight, windowBottom = window.screenY + window.outerHeight;
  const covered = Math.max(0, Math.min(120, windowBottom - bottom));
  document.documentElement.style.setProperty('--covered', covered + 'px');
}
keepAboveTaskbar(); window.addEventListener('resize', keepAboveTaskbar); setInterval(keepAboveTaskbar, 3000);
const $ = s => document.querySelector(s);

// ---- the User's choices (season, side, scope, welcome) are kept by Thalia in a file on this machine, not in the browser: the window that shows Thalia
// may be a private one that forgets everything when it closes. Read once, before the page is drawn; written at each change. ----------------------
const P = (() => { try { const x = new XMLHttpRequest(); x.open('GET', '/api/prefs', false); x.send(); return JSON.parse(x.responseText) || {}; } catch { return {}; } })();
function setPref(k, v) { P[k] = v; fetch('/api/prefs', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ [k]: v }) }).catch(() => { }); }

// ---- the season: the background follows the month (northern hemisphere); ?season=spring|summer|autumn|winter shows another one ----------------------
const SEASONS = {
  winter: { side: 'right', file: 'winter.jpg', by: 'Elio Pallard', title: 'La Sacra ammantata dalla neve', page: 'https://commons.wikimedia.org/wiki/File:La_Sacra_ammantata_dalla_neve.jpg' },
  spring: { side: 'left', file: 'spring.jpg', by: 'Elio Pallard', title: 'Nuvoloni sulla Sacra', page: 'https://commons.wikimedia.org/wiki/File:Nuvoloni_sulla_Sacra.jpg' },
  summer: { side: 'left', file: 'summer.jpg', by: 'Eugenio Vota', title: 'Sacra di San Michele su cielo azzurro e nuvole', page: 'https://commons.wikimedia.org/wiki/File:20160609_Sacra_di_San_Michele_su_cielo_azzurro_e_nuvole.jpg' },
  autumn: { side: 'left', file: 'autumn.jpg', by: 'Elio Pallard', title: 'La Sacra di San Michele in veste autunnale', page: 'https://commons.wikimedia.org/wiki/File:La_Sacra_di_San_Michele_in_veste_autunnale02.jpg' }
};
// The User chooses a season (kept in this browser) or leaves it to the calendar ("auto"). ?season=... still overrides, for a quick look.
function autoSeason() {
  const d = new Date(), v = (d.getMonth() + 1) * 100 + d.getDate();   // the astronomical seasons of the northern hemisphere: 20 March, 21 June, 22 September, 21 December
  return v >= 1221 || v < 320 ? 'winter' : v < 621 ? 'spring' : v < 922 ? 'summer' : 'autumn';
}
let chosen = 'auto';
chosen = P.season || 'auto';
function season() {
  const forced = new URLSearchParams(location.search).get('season');
  if (forced && SEASONS[forced]) return forced;
  return SEASONS[chosen] ? chosen : autoSeason();
}
function applySeason() {
  const k = season(), s = SEASONS[k];
  document.body.style.backgroundImage = `url(/seasons/${s.file})`;
  $('#credit').innerHTML = `Sacra di San Michele, Monte Pirchiriano (Valsusa): <a href="${s.page}" target="_blank" rel="noopener">${s.title}</a> by ${s.by}, CC BY-SA 4.0`;
  for (const b of document.querySelectorAll('#seasons button')) b.classList.toggle('on', b.dataset.k === chosen);
  for (const b of document.querySelectorAll('#seasons button')) b.classList.toggle('picked', chosen === 'auto' && b.dataset.k === k);   // the season Auto chose
}
{
  const box = $('#seasons');
  const mk = (k, label, img) => { const b = document.createElement('button'); b.dataset.k = k; b.title = label; b.setAttribute('aria-label', label);
    if (img) { b.style.backgroundImage = `url(/seasons/${img})`; } else { b.textContent = 'Auto'; }
    b.onclick = () => { chosen = k; setPref('season', k); applySeason(); if (typeof applySide === 'function') applySide(); }; box.appendChild(b); };
  mk('auto', 'Follow the calendar', null);
  for (const [k, s] of Object.entries(SEASONS)) mk(k, k[0].toUpperCase() + k.slice(1), s.file);
  applySeason();
}

// ---- state: what is shown is the scope of the search (this machine / the Service / both), limited by the two switches under her face ---------------------
let catalogue = null, shown = '', view = 'home', scope = '';      // Thalia comes up on what a User can do (Home), with no place chosen to look for Apps in: no App is shown before the User says where, or what, to look for
const searching = () => !!(scope || $('#q').value.trim());
const effScope = () => scope || 'both';          // a search with no place chosen looks in the three
const isRemote = () => catalogue && catalogue.profile === 'remote';   // a Remote Thalia: the Apps of MPAI as a Service only
const wheres = () => isRemote() ? ['mas'] : ['local', 'mas'].filter(w => effScope() === 'both' || effScope() === w);

let storeDrawn = false, storeQuery = '', storeOpen = null, devicesDrawn = false, settingsDrawn = false, aboutDrawn = false;
function syncControls() {
  for (const s of document.querySelectorAll('#scope span')) s.classList.toggle('on', s.dataset.s === scope);
  for (const b of document.querySelectorAll('.rail button[data-view]')) b.classList.toggle('on', b.dataset.view === view);
}
for (const s of document.querySelectorAll('#scope span')) s.onclick = () => {      // a place; the same place again takes it back
  scope = scope === s.dataset.s ? '' : s.dataset.s;
  if (view !== 'running') view = searching() ? 'apps' : 'home';
  syncControls(); render();
};
for (const b of document.querySelectorAll('.rail button[data-view]')) b.onclick = () => {
  view = b.dataset.view; storeDrawn = false; devicesDrawn = false; settingsDrawn = false; aboutDrawn = false;

// ---- the catalogue -----------------------------------------------------------------------------------------------------------------------------------
// Drawn again only when something changed, so that an open "What its Module needs" stays open.
async function load() {
  let text;
  try { text = await (await fetch('/api/catalogue', { cache: 'no-store' })).text(); }
  catch { $('#notice').hidden = false; $('#notice').textContent = 'Thalia does not answer.'; return; }
  if (text === shown) { drawStage(); return; }
  shown = text; catalogue = JSON.parse(text);
  if (new URLSearchParams(location.search).has('first')) { catalogue.apps = []; catalogue.running = []; }   // ?first=1 shows Thalia as a User sees it the first time: no Apps yet
  const open = new Set([...document.querySelectorAll('details[open]')].map(d => d.dataset.id));
  render(); drawStage();
  for (const d of document.querySelectorAll('details')) if (open.has(d.dataset.id)) d.open = true;
}

function runOf(id, where) { return (catalogue.running || []).find(r => r.app === id && r.where === where); }

function render() {
  if (!catalogue) { if (view === 'home' && !searching()) welcome(); return; }          // Home does not wait for the catalogue: what a User can do is shown at once
  const m = catalogue.machine;
  $('#scope').hidden = isRemote();
  $('#machine').textContent = isRemote() ? `Remote Thalia: the Apps of MPAI as a Service at ${new URL(catalogue.mas).hostname}` : `${m.os}, ${m.arch}; graphics: ${m.gpu}`;
  $('#notice').hidden = view === 'home' || !(catalogue.masProblem && wheres().includes('mas'));        // said where the User looks in that place, not on Home
  $('#notice').textContent = catalogue.masProblem || '';
  $('#q').placeholder = view === 'running' ? 'Search running Apps' : 'Search Apps by name or by what they do';

  $('.searchbar').hidden = view === 'store' || view === 'settings' || view === 'devices' || view === 'about';       // Home has it: it is where the User says where, and what, to look for
  if (view === 'about') { $('#notice').hidden = true; if (!aboutDrawn) aboutView(); return; }
  if (view === 'store') { $('#notice').hidden = true; if (!storeDrawn) storeView(); return; }
  if (view === 'settings') { $('#notice').hidden = true; if (!settingsDrawn) settingsView(); return; }
  if (view === 'devices') { $('#notice').hidden = true; if (!devicesDrawn) devicesView(); return; }
  if (view === 'home') { welcome(); return; }
  const q = $('#q').value.trim().toLowerCase(), ws = wheres();
  const byId = new Map();
  for (const a of catalogue.apps) { if (!byId.has(a.id)) byId.set(a.id, {}); byId.get(a.id)[a.where] = a; }
  const view_ = $('#view'); view_.innerHTML = '';
  const grid = document.createElement('div'); grid.className = 'grid';
  const showStore = view === 'apps' && !isRemote() && (effScope() === 'store' || effScope() === 'both');      // the third place to look: the MPAI Store
  let n = 0;
  for (const [id, sides] of byId) {
    const a = sides.local || sides.mas;
    if (!ws.some(w => sides[w])) continue;                                   // an App that is not in the place(s) chosen is not shown
    if (q && !`${a.name} ${id} ${a.description} ${a.module || ''}`.toLowerCase().includes(q)) continue;
    if (view === 'running' && !ws.some(w => { const r = runOf(id, w); return liveRun(r); })) continue;
    if (!ws.length) continue;
    const card = document.createElement('section'); card.className = 'card';
    card.innerHTML = `<div class="head"><img alt="" src="${a.icon}"><div><h3></h3><div class="id"></div></div></div><p class="desc"></p>`;
    card.querySelector('h3').textContent = a.name;
    card.querySelector('.id').textContent = `${id} - Module ${a.module || '?'}`;
    card.querySelector('.desc').textContent = a.description;
    for (const where of ws) card.appendChild(row(id, where, sides[where]));
    if (!isRemote()) card.appendChild(needs(sides.local || a));
    if (!isRemote() && sides.local && sides.local.obtained) card.appendChild(obtainedFooter(sides.local));
    grid.appendChild(card); n++;
  }
  if (n) view_.appendChild(grid);
  else if (!showStore) view_.innerHTML = `<p class="empty">${view === 'running' ? 'No App is running here.' : 'No App matches.'}</p>`;
  if (showStore) {
    const h = document.createElement('h2'); h.className = 'sec'; h.textContent = 'In the MPAI Store'; view_.appendChild(h);
    const box = document.createElement('div'); box.className = 'storefind'; view_.appendChild(box);
    clearTimeout(findTimer); findTimer = setTimeout(() => findInStore(box, $('#q').value.trim()), q ? 250 : 0);
  }
}

  ['Run and manage an App', 'Run an App on this machine or on MPAI as a Service. Stop it, pause it, resume it, update it when the Store has a newer version, or remove it. The microphone, the camera and the screen it uses are the ones chosen in Devices.', 'available',
    [['Apps', () => goView('apps')], ['Running', () => goView('running')], ['Devices', () => goView('devices')]]],
  ['Register an AIM', 'Become an Implementer in the MPAI Store, then offer your AIM (its L3) there, signed with your key, so that Modules and Apps can use it.', 'available',

  try { const r = await (await fetch('/api/store/apps', { cache: 'no-store' })).json(); if (r.store) { window.open(new URL('MPAI/Store/Register', r.store).href, '_blank', 'noopener'); return; } } catch { }

    intro.innerHTML = `<div class="fh" style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px"><div><h3 style="margin:0;font-size:26px;line-height:1.25">Welcome to Thalia</h3><p class="desc" style="font-size:16px;margin-top:2px">the MPAI AI Framework user environment</p></div><button class="act secondary" id="hideWelcome" title="Do not show this again">Hide</button></div>`;
    v.appendChild(intro);
    intro.querySelector('#hideWelcome').onclick = () => { setPref('welcomeHidden', true); render(); };
  }
  if (q) { const p = document.createElement('p'); p.className = 'empty'; p.textContent = `Nothing found for "${q}"${wheres().length ? ' in ' + wheres().map(w => w === 'local' ? 'this machine' : 'MPAI as a Service').join(' and ') : ''}.`; v.appendChild(p); }

// ---- the Store: Apps to obtain, with what each needs shown before the User accepts (APP-2, APP-3, APP-4, APP-5) -------------------------------------
async function storeView() {
  storeDrawn = true;
  const v = $('#view');
  v.innerHTML = '<p class="empty">Asking the Store...</p>';
  let r;
  try { r = await (await fetch('/api/store/apps' + (storeQuery ? '?search=' + encodeURIComponent(storeQuery) : ''), { cache: 'no-store' })).json(); }
  catch { v.innerHTML = '<p class="empty">Thalia does not answer.</p>'; storeDrawn = false; return; }
  v.innerHTML = '';
  const bar = document.createElement('div'); bar.className = 'storebar';
  bar.innerHTML = '<input type="search" placeholder="Search the Store for an App" autocomplete="off"><button class="act secondary">Search</button>';
  const input = bar.querySelector('input'); input.value = storeQuery;
  const go = () => { storeQuery = input.value.trim(); storeOpen = null; storeView(); };
  input.onkeydown = e => { if (e.key === 'Enter') go(); }; bar.querySelector('button').onclick = go;
  v.appendChild(bar);
  if (r.problem) { const n = document.createElement('div'); n.className = 'notice'; n.textContent = r.problem; v.appendChild(n); return; }
  if (!r.apps.length) { const p = document.createElement('p'); p.className = 'empty'; p.textContent = storeQuery ? `The Store has no App for "${storeQuery}".` : 'The Store has no App yet.'; v.appendChild(p); return; }
  const grid = document.createElement('div'); grid.className = 'grid';
  for (const a of r.apps) grid.appendChild(storeCard(a));
  v.appendChild(grid);
  if (storeOpen) { const c = grid.querySelector(`[data-app="${storeOpen}"] .more`); if (c) c.click(); }
}

// FIND AN APP in the MPAI Store: the same search, shown under the Apps of this machine and of MPAI as a Service; an App found there is obtained as in the Store.
let findTimer = null, findNo = 0;
async function findInStore(box, q) {
  const mine = ++findNo;
  box.innerHTML = '<p class="empty">Asking the MPAI Store...</p>';
  let r;
  try { r = await (await fetch('/api/store/apps' + (q ? '?search=' + encodeURIComponent(q) : ''), { cache: 'no-store' })).json(); }
  catch { if (mine === findNo) box.innerHTML = '<p class="empty">The Store does not answer.</p>'; return; }
  if (mine !== findNo) return;                                  // a later search has taken the place of this one
  box.innerHTML = '';
  if (r.problem) { const n = document.createElement('div'); n.className = 'notice'; n.textContent = r.problem; box.appendChild(n); return; }
  if (!r.apps.length) { const p = document.createElement('p'); p.className = 'empty'; p.textContent = q ? `The MPAI Store has no App for "${q}".` : 'The MPAI Store has no App yet.'; box.appendChild(p); return; }
  const grid = document.createElement('div'); grid.className = 'grid';
  for (const a of r.apps) grid.appendChild(storeCard(a));
  box.appendChild(grid);
}

const STATE_TEXT = { available: 'to obtain', obtained: 'obtained', update: 'update available', bundled: 'comes with Thalia' };
function storeCard(a) {
  const card = document.createElement('section'); card.className = 'card'; card.dataset.app = a.id;
  card.innerHTML = `<div class="fh" style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px"><div><h3 style="margin:0"></h3><div class="id"></div></div><span class="chip"></span></div><p class="desc"></p><div class="buttons" style="display:flex;gap:8px"><button class="act secondary more">Details</button></div><div class="detail" hidden></div>`;
  card.querySelector('h3').textContent = a.name;
  card.querySelector('.id').textContent = `${a.id} ${a.version} - Module ${a.module || '?'}${a.standard ? ' - ' + a.standard : ''}`;
  card.querySelector('.desc').textContent = a.description;
  const chip = card.querySelector('.chip'); chip.textContent = (STATE_TEXT[a.state] || a.state) + (a.runsHere === false && a.state === 'available' ? ' - not run by Thalia yet' : ''); chip.classList.add(a.state);
  const more = card.querySelector('.more'), box = card.querySelector('.detail');
  // The way to obtain (or update) an App is through what it needs and the licences, shown first: the button says so, and the state tag opens the same place.
  const label0 = a.state === 'available' ? 'Obtain...' : a.state === 'update' ? 'Update...' : 'Details';
  more.textContent = label0;
  if (a.state === 'available' || a.state === 'update') { chip.style.cursor = 'pointer'; chip.title = 'Open what it needs and the licences, then ' + label0.replace('...', '').toLowerCase() + ' it'; chip.onclick = () => { if (box.hidden) more.click(); }; }
  more.onclick = async () => {
    if (!box.hidden) { box.hidden = true; more.textContent = label0; storeOpen = null; return; }
    storeOpen = a.id; box.hidden = false; more.textContent = 'Hide'; box.textContent = 'Asking the Store what it needs...';
    let d; try { d = await (await fetch(`/api/store/apps/${encodeURIComponent(a.id)}`, { cache: 'no-store' })).json(); } catch { box.textContent = 'Thalia does not answer.'; return; }
    if (d.problem) { box.textContent = d.problem; return; }
    fillDetail(box, a, d);
  };
  return card;
}

function fillDetail(box, a, d) {
  const n = d.needs || {}, src = d.sources || [];
  const licences = [...new Set(src.map(s => s.licence).filter(Boolean))];
  const personal = src.some(s => s.personalData);
  box.innerHTML = `
    <h4>What the App is</h4><div>${esc(d.description)} Version ${esc(d.version)}${d.held ? `; you have ${esc(d.held.version)}` : ''}.</div>
    <h4>What the App itself needs</h4>
    <div>${(d.descriptor && d.descriptor.Asks && d.descriptor.Asks.length) ? 'It will ask you for: ' + d.descriptor.Asks.map(esc).join(', ') + '.' : 'It asks you for nothing.'}${d.descriptor && d.descriptor.Keeps ? ' What it keeps: ' + esc(d.descriptor.Keeps) : ''}</div>
    <h4>What its Module needs</h4>
    <div>Module ${esc(d.module)}: ${(n.aims || []).length} AIMs${(n.aims || []).length ? ' - ' + (n.aims || []).map(esc).join(', ') : ''}.</div>
    <div>Resources: ${(n.resources || []).length ? n.resources.map(esc).join('; ') : 'none stated'}${(n.accelerators || []).length ? '. Builds by processing unit: ' + n.accelerators.map(esc).join('; ') : ''}.</div>
    <div><b>This machine:</b> ${n.canRun ? '' : 'cannot run it - '}${esc(n.why || '')}</div>
    <h4>What its AIMs obtain, and under which licence</h4>
    ${src.length ? `<table class="tbl"><tr><th>AIM</th><th>What</th><th>From</th><th>Licence</th><th></th></tr>${src.map(s => `<tr><td>${esc(s.aim)}</td><td>${esc(s.name || '')}</td><td>${esc(s.from || '')}</td><td>${s.terms ? `<a href="${esc(s.terms)}" target="_blank" rel="noopener" style="color:var(--accent)">${esc(s.licence || 'terms')}</a>` : esc(s.licence || '?')}</td><td>${s.personalData ? 'personal data' : ''}</td></tr>`).join('')}</table>` : '<div>Nothing: its AIMs obtain nothing from outside.</div>'}
    ${personal ? '<div class="notice">Some of this involves personal data: read its terms before you accept.</div>' : ''}
    <label><input type="checkbox" class="acc"> <span>I accept the licences above${licences.length ? ' (' + licences.map(esc).join(', ') + ')' : ''}. The Controller obtains the AIMs of the Module, under their licences; Thalia obtains only the App.</span></label>
    <div class="buttons" style="display:flex;gap:8px"><button class="act obtain" disabled></button></div><div class="out"></div>`;
  const acc = box.querySelector('.acc'), btn = box.querySelector('.obtain'), out = box.querySelector('.out');
  const verb = a.state === 'update' ? 'Update' : a.state === 'available' ? 'Obtain' : null;
  if (!verb) { btn.textContent = a.state === 'bundled' ? 'Comes with Thalia' : 'You have the latest'; acc.parentElement.hidden = true; return; }
  btn.textContent = verb;
  acc.onchange = () => { btn.disabled = !acc.checked || (n.canRun === false); };
  if (n.canRun === false) acc.parentElement.insertAdjacentHTML('afterend', `<div class="notice">${a.runsHere === false ? 'Thalia does not run this App yet: it has a client of its own, which starts from AllApps.' : 'This machine does not meet what the Module needs.'}</div>`);
  btn.onclick = async () => {
    btn.disabled = true; out.innerHTML = '<div class="msg">Obtaining...</div>';
    let r; try { r = await fetch(`/api/store/obtain/${encodeURIComponent(a.id)}`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ accepted: true, version: d.version, licences }) }); } catch { out.innerHTML = '<div class="msg bad">Thalia does not answer.</div>'; return; }
    const j = await r.json();
    if (!r.ok) { out.innerHTML = `<div class="msg bad">${esc(j.error || 'It could not be obtained.')}</div>`; btn.disabled = false; return; }
    out.innerHTML = `<div class="msg">${esc(a.name)} ${esc(j.version)} is on this machine. Controller: ${esc((j.controller && j.controller.state) || '')}. You find it in Apps.</div>`;
    const chip = box.closest('.card').querySelector('.chip'); chip.textContent = STATE_TEXT.obtained; chip.className = 'chip obtained'; a.state = 'obtained'; btn.textContent = 'You have the latest'; acc.parentElement.hidden = true;
    shown = ''; await load();
  };
}

async function appAct(id, verb) {
  const r = await fetch(`/api/${verb}/${encodeURIComponent(id)}`, { method: 'POST' });
  if (!r.ok) { const j = await r.json().catch(() => ({})); $('#notice').hidden = false; $('#notice').textContent = j.error || `${verb} did not work.`; }
  shown = ''; load();
}

  v.appendChild(intro);
  let list = [];
  try { list = await MpaiUnits.devices.list(); } catch { }                 // the devices are the Units' to tell
  const named = list.some(d => d.label);
  intro.querySelector('#seeDevices').hidden = named;
  intro.querySelector('#seeDevices').onclick = async () => {
    const note = intro.querySelector('#seeNote'); note.textContent = 'Your browser asks whether Thalia may use them: it opens them only to read their names.';

function deviceCard(title, devices, pref, what) {

  if (!devices.length) { sel.innerHTML = '<option>none found</option>'; sel.disabled = true; c.querySelector('button').disabled = true; chip.textContent = 'none'; return c; }

const realDevices = (list, kind) => list.filter(d => d.kind === kind && d.label && d.deviceId !== 'default' && d.deviceId !== 'communications');
async function microphones() {
  let list = await MpaiUnits.devices.list();

// FIND MY MICROPHONE: the User speaks while Thalia listens to each microphone for a moment; the one that heard the User loudest is kept. say: where the steps are told; bar: where the level is drawn.
async function findMic(say, bar) {
  const tell = t => { if (say) say.textContent = t; };
  let mics = [];
  try { mics = await microphones(); } catch { }
  if (!mics.length) { tell('Thalia finds no microphone: is one connected, and has the browser been allowed to use it?'); return null; }
  let fill = null;
  if (bar) { bar.innerHTML = ''; const b = document.createElement('div'); b.style.cssText = 'height:10px;border-radius:5px;background:rgba(255,255,255,.15);overflow:hidden;margin-top:6px'; fill = document.createElement('div'); fill.style.cssText = 'height:100%;width:0;background:var(--ok)'; b.appendChild(fill); bar.appendChild(b); }
  const heard = [];
  for (const [i, m] of mics.entries()) {
    tell(`Speak now, and keep speaking - listening to ${m.label} (${i + 1} of ${mics.length})...`);
    try { heard.push({ m, peak: await MpaiUnits.microphone.test(m.deviceId, x => { if (fill) fill.style.width = Math.min(100, x * 400) + '%'; }, 2500) }); }
    catch { heard.push({ m, peak: 0 }); }
  }
  const best = heard.sort((a, b) => b.peak - a.peak)[0];
  if (!best || best.peak < 0.02) { tell(`No microphone heard you (${heard.map(h => `${h.m.label}: ${h.peak.toFixed(2)}`).join(', ')}): is it muted, or far from you? Try again.`); return null; }
  setPref('micLabel', best.m.label); knownMics = mics.map(m => m.label);
  tell(`Thalia uses ${best.m.label}: it heard you (${heard.map(h => `${h.m.label}: ${h.peak.toFixed(2)}`).join(', ')}). Every App you start from now on gets it.`);
  return best.m.label;
}

async function checkMics(changed) {

  if (!liveRun(run)) thaliaIn(false);                 // the App ended, however: she is back in her corner
  if (!run) { $('#stPhase').textContent = ''; say(a ? a.name : id, 'It is not running: it was stopped.'); }
  else if (run.phase === 'running' && run.url) {
    $('#stPhase').textContent = run.paused ? 'paused' : 'running'; $('#stPhase').className = 'status ' + (run.paused ? 'busy' : 'ok');
    // THE DEVICES THE USER CHOSE (APP-7) go with the App: the client opens that microphone and that camera.
    const u = new URL(run.url); if (P.micLabel) u.searchParams.set('mic', P.micLabel); if (P.camLabel) u.searchParams.set('cam', P.camLabel);
    if (stagedUrl !== u.href) { stagedUrl = u.href; frame.src = u.href; }
    msg.hidden = true; frame.style.visibility = 'visible'; $('#stage').classList.remove('msgonly');
    thaliaIn(!WITHOUT_HER.has(id));
  }
  else if (run.phase === 'running') {
    $('#stPhase').textContent = 'running'; $('#stPhase').className = 'status ok';
    say(a ? a.name : id, said.length ? 'It works in a window of its own: what it is doing -' : 'It asks you in a window of its own, on this screen: answer it there. Stop it here.', false, said.slice(-7));
    thaliaIn(!WITHOUT_HER.has(id));
    placeOwnWindow(staged, false);                          // its window, on the stage (a dialog is only brought in front)
  }
  else if (!liveRun(run) && results && /exit code 0/.test(run.phase)) {
    $('#stPhase').textContent = 'done'; $('#stPhase').className = 'status ok';
    if (shownResults) { if (resultsDrawnFor !== shownResults) showResults(shownResults, a); }      // drawn once: a playing WAV is not cut by the next look at the runs
    else say('Done', results.replace(/^Results in /, 'The results are in ') + '.', false, said.slice(-7, -1), [seeThem]);
  }
  else if (!liveRun(run) && /exit code 0/.test(run.phase)) { $('#stPhase').textContent = 'ended'; say(a ? a.name : id, 'It has ended.', false, said.slice(-7)); }
  else if (!liveRun(run)) { $('#stPhase').textContent = ''; say(a ? a.name : id, run.phase, true, said.slice(-7)); }
  else { $('#stPhase').textContent = 'starting'; $('#stPhase').className = 'status busy'; say(`Starting ${a ? a.name : id}...`, run.phase + '...'); }
  // the other Apps that are running: a click shows one of them here
  const others = $('#stOthers'); others.innerHTML = '';
  for (const r of (catalogue.running || []).filter(r => liveRun(r) && !(r.app === id && r.where === where))) {
    const b = document.createElement('button'); const o = appOf(r.app, r.where); b.textContent = o ? o.name : r.app;
    b.title = `Show ${o ? o.name : r.app} (${r.where === 'local' ? 'this machine' : 'MPAI as a Service'}) here`; b.onclick = () => stage(r.app, r.where); others.appendChild(b);
  }
}
$('#stStop').onclick = async () => {
  if (!staged) return;
  const { id, where } = staged; $('#stStop').disabled = true;
  try { await fetch(`/api/stop/${where}/${id}`, { method: 'POST' }); } catch { }
  $('#stStop').disabled = false; unstage(); shown = ''; load();
};
$('#stHide').onclick = () => unstage();

// ---- Settings (APP-1): where Thalia looks -------------------------------------------------------------------------------------------------------------
// ---- About MPAI: the video that tells what MPAI proposes (it is not an App: it has no Module work to do; the MAS instance offers it as the App About MPAI) ----------------
function aboutView() {
  aboutDrawn = true;
  const v = $('#view'); v.innerHTML = '';
  const card = document.createElement('section'); card.className = 'card';
  card.innerHTML = `<div style="background:#fff;border-radius:10px;padding:8px 14px;display:inline-block;margin-bottom:10px"><img src="/mpai-logo.png" alt="MPAI community" style="height:64px;display:block"></div><h3 style="margin:0;font-size:20px">About MPAI</h3><p class="desc">In alcuni minuti potete avere un'idea chiara (ma senza dettagli) della proposta MPAI.</p>
    <div style="position:relative;width:100%;aspect-ratio:16/9;margin-top:8px;border-radius:8px;overflow:hidden;background:#000">
      <iframe src="https://www.youtube.com/embed/ITG6fff89yM" title="About MPAI" style="position:absolute;inset:0;width:100%;height:100%;border:0" allow="accelerometer; autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </div>
    <p class="desc" style="margin-top:8px"><a href="https://youtu.be/ITG6fff89yM" target="_blank" rel="noopener" style="color:var(--accent)">Open the video on YouTube</a> - it needs the Internet.</p>`;
  v.appendChild(card);
}

async function settingsView() {
  settingsDrawn = true;
  const v = $('#view'); v.innerHTML = '';
  let st; try { st = await (await fetch('/api/settings', { cache: 'no-store' })).json(); } catch { v.innerHTML = '<p class="empty">Thalia does not answer.</p>'; settingsDrawn = false; return; }
  const card = document.createElement('section'); card.className = 'card';
  card.innerHTML = `<h3 style="margin:0;font-size:20px">Settings</h3><p class="desc">Where Thalia looks for Apps, and where it keeps what is yours.</p>`;
  const field = (label, kind, value, hint, fixed) => {
    const d = document.createElement('div'); d.className = 'detail'; d.style.borderTop = '0';
    d.innerHTML = `<h4></h4><div class="buttons" style="display:flex;gap:8px"><input type="text" style="flex:1;font:inherit;padding:6px 8px;border-radius:7px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--ink)"><button class="act secondary t">Test</button><button class="act s">Keep</button></div><div class="out desc"></div>`;
    d.querySelector('h4').textContent = label; const input = d.querySelector('input'); input.value = value || ''; input.placeholder = hint; input.disabled = !!fixed;
    const out = d.querySelector('.out'); d.querySelector('.s').disabled = !!fixed;
    d.querySelector('.t').onclick = async () => { out.textContent = 'Asking...'; const r = await (await fetch('/api/settings/test', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ kind, url: input.value.trim() }) })).json(); out.textContent = r.text; out.style.color = r.ok ? 'var(--ok)' : 'var(--bad)'; };
    d.querySelector('.s').onclick = async () => {
      const r = await fetch('/api/settings', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ [kind]: input.value.trim() }) });
      const j = await r.json().catch(() => ({})); out.style.color = r.ok ? 'var(--ok)' : 'var(--bad)'; out.textContent = r.ok ? 'Kept. Thalia looks there from now on.' : (j.error || 'It could not be kept.'); shown = ''; storeDrawn = false; load();
    };
    return d;
  };
  card.appendChild(field('The MPAI as a Service instance you use', 'mas', st.mas, 'https://...', st.fixed));
  if (!st.fixed) card.appendChild(field('The MPAI Store you use', 'store', st.store, 'http://...', false));
  if (st.fixed) { const n = document.createElement('p'); n.className = 'desc'; n.textContent = 'This is a Remote Thalia: it uses the Service of its package.'; card.appendChild(n); }
  if (st.data) {
    const d = document.createElement('div'); d.className = 'detail';
    d.innerHTML = '<h4>Where your things are kept</h4><div class="desc"></div>'; d.querySelector('.desc').textContent = `Your Apps: ${st.apps}. Your choices, the Store and what you obtained: ${st.data}.`; card.appendChild(d);
  }
  if (P.welcomeHidden === true) {
    const b = document.createElement('button'); b.className = 'act secondary'; b.style.alignSelf = 'flex-start'; b.textContent = 'Show the welcome again';
    b.onclick = () => { setPref('welcomeHidden', false); b.disabled = true; b.textContent = 'The welcome is back'; };
    card.appendChild(b);
  }
  v.appendChild(card);
}

function row(id, where, entry) {
  const div = document.createElement('div'); div.className = 'where';
  const label = where === 'local' ? 'On this machine' : 'MPAI as a Service';
  const run = runOf(id, where);
  let text, cls = '';
  if (!entry && !run) { text = where === 'mas' ? (catalogue.masProblem ? 'the Service is not running: Run starts it' : 'not offered by the Service') : 'not on this machine'; }
  else if (run && run.phase === 'running') { text = run.paused ? 'paused' : 'running'; cls = run.paused ? 'busy' : 'ok'; }
  else if (run && run.phase.startsWith('failed')) { text = run.phase; cls = 'bad'; }
  else if (run && (run.phase.startsWith('stopped') || run.phase.startsWith('ended'))) { text = /exit code 0/.test(run.phase) ? 'ended' : run.phase; }
  else if (run) { text = run.phase + '...'; cls = 'busy'; }
  else { text = where === 'local' ? (entry.canRun ? 'ready to run' : 'cannot run: ' + entry.why) : 'offered'; }
  div.innerHTML = `<span class="label"></span><span class="status ${cls}"></span><span class="buttons"></span>`;
  div.querySelector('.label').textContent = label;
  div.querySelector('.status').textContent = text;
  const b = div.querySelector('.buttons');
  const live = liveRun(run);
  if (live && !otherScreen() && !(staged && staged.id === id && staged.where === where)) { const o = document.createElement('button'); o.className = 'act'; o.textContent = 'Show'; o.title = 'Show the App here, between the rail and the functions'; o.onclick = () => stage(id, where); b.appendChild(o); }
  else if (live && run.url && otherScreen()) { const o = document.createElement('a'); o.className = 'btn'; o.href = run.url; o.target = '_blank'; o.rel = 'noopener'; o.textContent = 'Open'; b.appendChild(o); }
  const go = document.createElement('button'); go.className = 'act'; go.textContent = 'Run';
  go.disabled = !!live || (where === 'local' && entry && !entry.canRun) || (!entry && where === 'local');
  // The App's tab is opened by the click itself (a tab opened later is blocked as a pop-up); it shows the start and becomes the App when ready.
  go.onclick = async () => {
    go.disabled = true;
    if (otherScreen()) openApp(`/wait.html?where=${where}&id=${encodeURIComponent(id)}`);
    await fetch(`/api/run/${where}/${id}`, { method: 'POST' });
    if (!otherScreen()) stage(id, where);
    shown = ''; load();
  };
  const stop = document.createElement('button'); stop.className = 'act secondary'; stop.textContent = 'Stop'; stop.disabled = !live;
  stop.onclick = async () => { stop.disabled = true; await fetch(`/api/stop/${where}/${id}`, { method: 'POST' }); load(); };
  b.appendChild(go); b.appendChild(stop);
  if (where === 'local' && live && run.phase === 'running') {
    const pr = document.createElement('button'); pr.className = 'act secondary'; pr.textContent = run.paused ? 'Resume' : 'Pause';
    pr.title = run.paused ? 'Let the AIMs of its Module work again' : 'Every AIM of its Module completes what it is doing and waits';
    pr.onclick = async () => { pr.disabled = true; await appAct(id, run.paused ? 'resume' : 'pause'); };
    b.appendChild(pr);
  }
  return div;
}

// An App the User obtained: its version, and Remove (the App only: its Module stays with the Controller, another App may use it).
function obtainedFooter(a) {
  const d = document.createElement('div'); d.className = 'where';
  d.innerHTML = '<span class="label">Obtained</span><span class="status"></span><span class="buttons"></span>';
  d.querySelector('.status').textContent = `version ${a.version || '?'}, from the Store at ${a.from ? new URL(a.from).host : '?'}`;
  const rm = document.createElement('button'); rm.className = 'act secondary'; rm.textContent = 'Remove';
  const live = liveRun(runOf(a.id, 'local'));
  rm.disabled = !!live; rm.title = live ? 'Stop it first' : 'Remove the App from this machine; its Module stays';
  rm.onclick = async () => { if (!confirm(`Remove ${a.name} from this machine? Its Module and AIMs stay with the Controller.`)) return; rm.disabled = true; await appAct(a.id, 'remove'); };
  d.querySelector('.buttons').appendChild(rm);
  return d;
}

function needs(a) {
  const d = document.createElement('details'); d.dataset.id = a.id;
  const list = (title, items) => items && items.length ? `<li>${title}: ${items.map(esc).join(', ')}</li>` : '';
  d.innerHTML = `<summary>What its Module needs</summary><ul>${list('AIMs', a.aims)}${list('The App will ask you for', a.asks)}${a.keeps ? `<li>What it keeps: ${esc(a.keeps)}</li>` : ''}${list('Licences of the data its AIMs obtain', a.licences)}${list('Resources', a.resources)}${list('Builds by processing unit', a.accelerators)}<li>This machine: ${esc(a.why || '')}</li></ul>`;
  return d;
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

syncControls();
render();
load();
setInterval(load, 2000);
setInterval(() => { if (staged && !(runOf(staged.id, staged.where) || {}).url && liveRun(runOf(staged.id, staged.where))) load(); }, 700);   // an App starting on the stage: seen sooner
</script>
