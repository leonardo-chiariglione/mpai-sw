<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MPAI Knowledge Graph Finder</title>
<meta name="description" content="Find an MPAI AIM, Data Type or Standard by name or acronym, even if incomplete, and open its web page, schema, software and map of connections.">
<style>
:root { --bg:#f6f7f9; --panel:#ffffff; --ink:#0b1220; --muted:#46506a; --line:#b4bccb; --accent:#0a2fa0; --on:#e4ebff;
        --aim:#3b82f6; --dt:#16a34a; --std:#f59e0b; --part:#d97706; --warn:#7c1d00; --chip:#eef1f6; }
@media (prefers-color-scheme: dark) { :root { --bg:#12151b; --panel:#1b2029; --ink:#f2f5fb; --muted:#b8c1d6; --line:#3a4456; --accent:#8fb0ff; --on:#26314d; --warn:#ffb199; --chip:#242b38; color-scheme:dark; } }
* { box-sizing:border-box; }
body { margin:0; font:17px/1.5 system-ui,"Segoe UI",Arial,sans-serif; background:var(--bg); color:var(--ink); }
header { display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; padding:12px 18px; background:var(--panel); border-bottom:1px solid var(--line); }
header h1 { font-size:22px; margin:0; }
header .sp { flex:1; }
a { color:var(--accent); } a.n { cursor:pointer; text-decoration:none; } a.n:hover { text-decoration:underline; }
.tabs { display:flex; gap:8px; padding:14px 18px 0; flex-wrap:wrap; }
.tab { border:1px solid var(--line); background:var(--panel); color:var(--ink); padding:9px 18px; border-radius:999px; cursor:pointer; font:inherit; font-weight:600; }
.tab[aria-selected="true"] { background:var(--accent); color:var(--bg); border-color:var(--accent); }
.tab small { font-weight:400; opacity:.8; margin-left:6px; }
.bar { padding:12px 18px 6px; }
#q { width:100%; max-width:760px; padding:12px 14px; border:2px solid var(--line); border-radius:10px; background:var(--panel); color:var(--ink); font:inherit; font-size:19px; }
#q:focus { outline:none; border-color:var(--accent); }
.hint { color:var(--muted); font-size:15.5px; margin:8px 2px 0; }
#home { padding:0 18px 40px; }
#home h2 { font-size:20px; margin:6px 2px 12px; }
.stdgrid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
.stdcell { text-align:left; padding:14px 16px; border:1px solid var(--line); border-radius:10px; background:var(--panel); color:var(--ink); font:inherit; font-size:17px; cursor:pointer; }
.stdcell:hover { border-color:var(--accent); }
@media (max-width:900px) { .stdgrid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
@media (max-width:600px) { .stdgrid { grid-template-columns:minmax(0,1fr); } }
.wrap { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:18px; padding:10px 18px 40px; align-items:start; }
.rp { display:flex; flex-direction:column; gap:16px; min-width:0; }
.lp { display:flex; flex-direction:column; gap:16px; min-width:0; }
#rest { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:4px 22px 18px; }
#rest:empty { display:none; }
#rest > h3:first-child { margin-top:18px; }
@media (max-width:1100px) { .wrap { grid-template-columns:1fr; } }
#list { list-style:none; margin:0; padding:0; background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
#list li { padding:9px 14px; border-bottom:1px solid var(--line); cursor:pointer; }
#list li:last-child { border-bottom:0; }
#list li:hover, #list li.on { background:var(--on); }
#list b { font-weight:700; }
#list .t { display:block; color:var(--muted); font-size:15.5px; }
.tag { display:inline-block; font-size:13.5px; padding:1px 8px; border-radius:10px; border:1px solid var(--line); color:var(--muted); margin:0 4px 2px 0; background:var(--chip); }
.count { padding:8px 14px; color:var(--muted); font-size:15px; background:var(--chip); border-bottom:1px solid var(--line); }
#card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:18px 22px 22px; min-height:200px; }
#card:empty { display:none; }
#card h2 { font-size:27px; margin:0 0 2px; word-break:break-word; }
#card .nm { font-size:19px; margin:0 0 10px; color:var(--ink); }
#card h3, #rest h3 { font-size:14.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:22px 0 8px; }
.links { display:flex; flex-wrap:wrap; gap:8px 10px; margin:12px 0 4px; }
.links a, .links span.off { display:inline-block; padding:8px 14px; border-radius:8px; border:1px solid var(--accent); text-decoration:none; font-weight:600; }
.links a:hover { background:var(--on); }
.links span.off { border-color:var(--line); color:var(--muted); font-weight:400; }
.desc { color:var(--ink); margin:6px 0; }
table { border-collapse:collapse; width:100%; font-size:16px; }
td, th { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
th { color:var(--muted); font-size:14.5px; }
.chips a { display:inline-block; margin:0 6px 6px 0; padding:3px 10px; border-radius:8px; background:var(--chip); border:1px solid var(--line); text-decoration:none; font-size:15.5px; cursor:pointer; }
.chips a:hover { background:var(--on); }
.note { color:var(--muted); font-size:15px; }
.warn { color:var(--warn); }
code { font-size:14.5px; background:var(--chip); padding:1px 6px; border-radius:4px; word-break:break-all; }
details { margin:2px 0; } summary { cursor:pointer; color:var(--accent); }
.map { overflow-x:auto; border:1px solid var(--line); border-radius:10px; background:var(--bg); }
.map svg { display:block; margin:0 auto; }
.map text { font:13.5px system-ui,"Segoe UI",Arial,sans-serif; fill:var(--ink); }
.map .nd { cursor:pointer; } .map .nd:hover rect { stroke-width:3; }
.map .ctr rect { stroke-width:3; }
.map .more rect { fill:var(--chip); stroke:var(--line); stroke-dasharray:4 3; }
.map line { stroke:var(--muted); stroke-width:1.4; opacity:.8; }
.legend { color:var(--muted); font-size:14.5px; margin:6px 2px 0; }
.empty { padding:24px 6px; color:var(--muted); }
.top { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:18px; align-items:start; padding-right:18px; }
.tl { min-width:0; }
@media (max-width:900px) { .top { grid-template-columns:minmax(0,1fr); } }
#intro p { margin:14px 2px 0; max-width:900px; color:var(--muted); font-size:15.5px; }
.ex a { display:inline-block; margin:0 14px 6px 0; cursor:pointer; }
</style>
</head>
<body>
<header>
  <h1>MPAI Knowledge Graph Finder</h1>
  <span class="sp"></span>
  <a id="full" href="#" target="_blank" rel="noopener">Open the full graph explorer</a>
  <span class="note" id="gen"></span>
</header>
<div class="top"><div class="tl">
<div class="tabs" role="tablist" id="tabs"></div>
<div class="bar">
  <input id="q" type="search" autocomplete="off" spellcheck="false" aria-label="Name or acronym">
  <p class="hint" id="hint"></p>
</div>
</div>
<div id="intro"></div></div>
<div class="wrap">
  <div class="lp"><div id="card"></div></div>   <!-- left pane: the heading box and the map -->
  <div class="rp"><ul id="list"></ul><div id="rest"></div></div>   <!-- right pane, top aligned with the card: the matches, then the rest -->
</div>
<div id="home"></div>
<script>
const DATA = /*DATA*/null;
const NAMES = /*NAMES*/null;
const N = {}; DATA.nodes.forEach(n => N[n.id] = n);
const $ = id => document.getElementById(id);
const el = (t, a, ...k) => { const e = document.createElement(t); for (const x in (a || {})) { if (typeof a[x] === 'function') e[x] = a[x]; else e.setAttribute(x, a[x]); } k.flat().forEach(c => e.append(c && c.nodeType ? c : document.createTextNode(c == null ? '' : c))); return e; };
const norm = s => (s || '').toLowerCase().replace(/[^a-z0-9.]+/g, ' ').trim();
const flat = s => (s || '').toLowerCase().replace(/[^a-z0-9]+/g, '');

// ---- what each tab searches
const KIND = { AIM:'AIM', DataType:'DataType', Standard:'Standard' };
const TABS = [['AIM', 'AIM', 'AI Modules'], ['DataType', 'Data Type', 'Data Types'], ['Standard', 'Standard', 'Standards and Parts']];
const items = { AIM:[], DataType:[], Standard:[] };
const stdName = {};   // acronym of a standard or part -> its name
DATA.nodes.forEach(n => {
  if (n.kind === 'Standard') { stdName[n.label] = NAMES.standards[n.label] || n.title || ''; }
  if (n.kind === 'Part') { stdName[n.label] = NAMES.parts[n.label] || ''; }
});
const partOfStd = {};   // Part id -> the Standard it belongs to
(DATA.edges || []).forEach(([a, r, b]) => { if (r === 'partOf' && N[a] && N[a].kind === 'Part') partOfStd[a] = b; });
DATA.nodes.forEach(n => {
  const k = n.kind === 'Part' ? 'Standard' : n.kind;
  if (!items[k]) return;
  if (n.kind === 'Standard' && !n.listed) return;                                   // the list of standards is that of M3076
  if (n.kind === 'Part' && !(N[partOfStd[n.id]] && N[partOfStd[n.id]].listed)) return;
  n.name = n.kind === 'Standard' || n.kind === 'Part' ? (stdName[n.label] || '') : (n.title || '');
  n.hay = norm(n.label + ' ' + n.name + ' ' + (n.kind === 'Standard' || n.kind === 'Part' ? '' : (stdName[n.std] || '')));
  n.flat = flat(n.label);
  items[k].push(n);
});
Object.values(items).forEach(a => a.sort((x, y) => x.label.localeCompare(y.label)));

// ---- relations
const out = {}, inn = {}, parents = {}, usedBy = {}, members = {}, l3s = {}, impl = {}, appsOf = {};
DATA.nodes.filter(n => n.kind === 'AIM').forEach(a => {
  a.ports.forEach(p => { (p.dir === 'Output' ? out : inn)[p.dt] = (p.dir === 'Output' ? out : inn)[p.dt] || []; (p.dir === 'Output' ? out : inn)[p.dt].push(a.id); });
  a.subs.forEach(s => (parents[s] = parents[s] || []).push(a.id));
});
DATA.nodes.filter(n => n.kind === 'DataType').forEach(d => d.uses.forEach(u => (usedBy[u] = usedBy[u] || []).push(d.id)));
DATA.nodes.filter(n => n.kind === 'L3').forEach(l => (l3s[l.of] = l3s[l.of] || []).push(l.id));
(DATA.edges || []).forEach(([a, r, b]) => {
  if (r === 'implements' && N[a] && N[a].kind === 'Software') (impl[b] = impl[b] || []).push(a);
  if (r === 'runsModule' && N[a] && N[a].kind === 'App') (appsOf[b] = appsOf[b] || []).push(a);
  if (r === 'specifies' && N[a] && N[a].kind === 'Part') (members[a] = members[a] || []).push(b);
  if (r === 'partOf' && N[a] && N[a].kind === 'Part') (members['partsOf:' + b] = members['partsOf:' + b] || []).push(a);
});
const uniq = a => [...new Set(a)];
const byLabel = (x, y) => N[x].label.localeCompare(N[y].label);
function membersOf(n) {          // the AIMs and Data Types a Standard or a Part specifies
  let ids = [];
  if (n.kind === 'Part') ids = members[n.id] || [];
  else { ids = DATA.nodes.filter(m => (m.kind === 'AIM' || m.kind === 'DataType') && m.std === n.label).map(m => m.id); (members['partsOf:' + n.id] || []).forEach(p => ids = ids.concat(members[p] || [])); }
  return uniq(ids).filter(i => N[i] && (N[i].kind === 'AIM' || N[i].kind === 'DataType')).sort(byLabel);
}
function stdOf(id) { const n = N[id]; if (n && n.kind === 'Part') return partOfStd[id] || ''; return n && n.std && N['STD:' + n.std] ? 'STD:' + n.std : ''; }

// ---- matching: every word of the query must be found in the acronym or the name
function find(kind, q) {
  const words = norm(q).split(' ').filter(Boolean), f = flat(q);
  if (!words.length) return [];
  const res = [];
  items[kind].forEach(n => {
    const lab = n.label.toLowerCase();
    let s = -1;
    if (lab === q.trim().toLowerCase() || n.flat === f) s = 0;
    else if (n.flat.startsWith(f)) s = 1;
    else if (n.flat.includes(f)) s = 2;
    else if (norm(n.name).startsWith(norm(q))) s = 3;
    else if (words.every(w => n.hay.includes(w))) s = 4;
    if (s >= 0) res.push([s, n]);
  });
  res.sort((a, b) => a[0] - b[0] || a[1].label.localeCompare(b[1].label));
  return res.map(r => r[1]);
}

// ---- state
let tab = 'AIM', query = '', current = null, shown = [], sel = -1, expand = {};
function buildTabs() {
  const t = $('tabs'); t.innerHTML = '';
  TABS.forEach(([k, one, many]) => t.append(el('button', { class:'tab', role:'tab', 'aria-selected':String(k === tab), 'data-k':k }, one, el('small', {}, items[k].length + ''))));
  t.onclick = ev => { const b = ev.target.closest('.tab'); if (b) { setTab(b.dataset.k); $('q').focus(); } };
}
function setTab(k) { tab = k; query = ''; $('q').value = ''; current = null; buildTabs(); hintFor(); renderList(); renderCard(); location.hash = ''; }
function hintFor() {
  const ex = { AIM:['PMX', 'speech rec', 'MMC-EDP', 'action gen'], DataType:['Personal Status', 'OSD-BTO', 'text obj', 'FDO'], Standard:['MMC', 'portable avatar', 'CAE-USC', 'watermark'] }[tab];
  $('q').placeholder = { AIM:'Name or acronym of an AIM, even incomplete', DataType:'Name or acronym of a Data Type, even incomplete', Standard:'Name or acronym of a Standard or Part, even incomplete' }[tab];
  const h = $('hint'); h.innerHTML = ''; h.append('Type part of a name or an acronym, then pick the one you mean. For example: ');
  ex.forEach((x, i) => h.append(el('a', { class:'n', onclick:"$('q').value='" + x + "'; $('q').dispatchEvent(new Event('input')); $('q').focus();" }, x), i < ex.length - 1 ? ', ' : '.'));
}
function tags(n) {
  const t = [];
  if (n.kind === 'Part') t.push('Part'); else if (n.kind === 'Standard') t.push('Standard');
  if (n.kind === 'AIM' && n.std) t.push(n.std);
  if (n.kind === 'DataType' && n.std) t.push(n.std);
  if (n.code || (l3s[n.id] || []).some(l => N[l].code)) t.push('software');
  if (n.webOnly) t.push('web only');
  if (n.declaredOnly) t.push('no schema');
  return t;
}
function renderList() {
  const ul = $('list'); ul.innerHTML = '';
  shown = query.trim() ? find(tab, query) : [];
  if (!query.trim()) { ul.style.display = 'none'; return; }
  ul.style.display = '';
  if (!shown.length) { ul.append(el('li', { style:'cursor:default' }, 'Nothing contains "' + query.trim() + '". Try fewer letters, or another tab.')); return; }
  ul.append(el('div', { class:'count' }, shown.length + (shown.length === 1 ? ' match' : ' matches') + (shown.length > 1 ? ': pick the one you mean' : '')));
  shown.slice(0, 80).forEach((n, i) => ul.append(el('li', { 'data-i':i, class:n === current ? 'on' : '' },
    el('b', {}, n.label), '  ', tags(n).map(t => el('span', { class:'tag' }, t)), el('span', { class:'t' }, n.name || ''))));
  if (shown.length > 80) ul.append(el('div', { class:'count' }, 'Only the first 80 are shown: type more of the name.'));
  if (shown.length === 1 && !current) open(shown[0].id, true);
}
$('list').onclick = ev => { const li = ev.target.closest('li[data-i]'); if (li) open(shown[+li.dataset.i].id); };
$('q').addEventListener('input', () => { query = $('q').value; current = null; if (query.trim()) $('intro').innerHTML = ''; renderList(); renderHome(); if (!query.trim()) renderCard(); });
$('q').addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && shown.length) open(shown[Math.max(sel, 0)].id);
  if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') { ev.preventDefault(); sel = Math.max(0, Math.min(shown.length - 1, sel + (ev.key === 'ArrowDown' ? 1 : -1))); [...$('list').querySelectorAll('li[data-i]')].forEach((l, i) => l.classList.toggle('on', i === sel)); }
});

// ---- opening an item (from the list, from a link, from the address)
function kindTab(n) { return n.kind === 'Part' ? 'Standard' : n.kind; }
function open(id, quiet) {
  const n = N[id]; if (!n || !items[kindTab(n)]) return;
  if (kindTab(n) !== tab) { tab = kindTab(n); buildTabs(); hintFor(); }
  current = n; expand = {};
  const hh = '#' + encodeURIComponent(id);   // each card the user opens is a step of the browser history, so Back returns to the previous card
  if (location.hash !== hh) { if (quiet) history.replaceState(null, '', hh); else history.pushState(null, '', hh); }
  if (!$('q').value.trim() || !find(tab, $('q').value).includes(n)) { $('q').value = n.label; query = n.label; }
  renderList(); renderCard(); $('card').scrollIntoView({ block:'nearest' });
}
window.addEventListener('hashchange', () => {   // Back / Forward: show the card of the address, or the home page when there is none
  const h = decodeURIComponent(location.hash.slice(1));
  if (h && N[h]) { if (N[h] !== current) open(h, true); }
  else if (!h && (current || query.trim())) { current = null; query = ''; $('q').value = ''; renderList(); renderCard(); }
});

// ---- links
function linkBox(n) {
  const L = [], add = (href, text) => href ? L.push(el('a', { href, target:'_blank', rel:'noopener' }, text)) : null;
  if (n.kind === 'Standard') { add(n.site, 'Standard website'); add(n.about, 'About page'); add(n.web, 'Web specification'); }
  else if (n.kind === 'Part') add(n.web, 'Web specification');
  else { add(n.page, 'Web page'); if (!n.page) add(n.web, 'Web specification'); }
  if (n.kind === 'AIM' || n.kind === 'DataType') add(n.schema, 'JSON schema');
  if (n.code) add(n.code, 'Software');
  if (!L.length) L.push(el('span', { class:'off' }, 'No web page or schema recorded'));
  if (n.kind !== 'Standard' && n.kind !== 'Part' && !n.page && !n.web) { /* nothing */ }
  if (n.kind === 'AIM' && !n.schema) L.push(el('span', { class:'off' }, 'No schema'));
  if (n.kind === 'DataType' && !n.schema) L.push(el('span', { class:'off' }, 'No schema (declared only)'));
  return el('div', { class:'links' }, L);
}
function chip(id) { const n = N[id]; return el('a', { onclick:() => open(id), title:n.name || n.title || '' }, n.label); }
function chips(ids, cap, key) {
  ids = uniq(ids); const all = !!expand[key], lim = all ? ids.length : cap;
  const d = el('div', { class:'chips' }, ids.slice(0, lim).map(chip));
  if (ids.length > lim) d.append(el('a', { onclick:() => { expand[key] = true; renderCard(); } }, '+ ' + (ids.length - lim) + ' more'));
  return d;
}

// ---- the map of connections: a centre, a column on each side, a row above and below
const W = 800, BW = 188, BH = 32, GAP = 10;
function mapSVG(center, cols, key) {
  const lim = k => expand[key + k] ? 1e9 : 9;
  const lists = {};
  ['left', 'right', 'top', 'bottom'].forEach(k => { const a = cols[k] || []; lists[k] = a.slice(0, lim(k)).map(x => x); if (a.length > lim(k)) lists[k].push({ more:a.length - lim(k), k }); });
  const side = Math.max(lists.left.length, lists.right.length, 1);
  const rows = (lists.top.length ? 1 : 0) + (lists.bottom.length ? 1 : 0);
  const H = Math.max(side * (BH + GAP) + GAP, 120) + rows * (BH + 40);
  const topY = lists.top.length ? BH + 34 : 0;
  const midY = topY + Math.max(side * (BH + GAP) + GAP, 120) / 2;
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H); svg.setAttribute('style', 'width:100%; max-width:' + W + 'px; height:auto; min-width:560px');
  const S = (t, a, ...k) => { const e = document.createElementNS('http://www.w3.org/2000/svg', t); for (const x in a) e.setAttribute(x, a[x]); k.forEach(c => e.append(typeof c === 'string' ? document.createTextNode(c) : c)); return e; };
  svg.append(S('defs', {}, S('marker', { id:'ar', viewBox:'0 0 10 10', refX:'9', refY:'5', markerWidth:'7', markerHeight:'7', orient:'auto-start-reverse' }, S('path', { d:'M0 0 L10 5 L0 10 z', fill:'currentColor', style:'color:var(--muted)' }))));
  const colour = k => ({ AIM:'var(--aim)', DataType:'var(--dt)', Standard:'var(--std)', Part:'var(--part)' }[k] || 'var(--line)');
  const cx = W / 2 - BW / 2, cy = midY - BH / 2;
  const node = (x, y, it, ctr) => {
    if (it.more) { const g = S('g', { class:'nd more' }, S('rect', { x, y, width:BW, height:BH, rx:8, fill:'none' }), S('text', { x:x + BW / 2, y:y + BH / 2 + 5, 'text-anchor':'middle' }, '+ ' + it.more + ' more'));
      g.onclick = () => { expand[key + it.k] = true; renderCard(); }; return g; }
    const n = N[it.id]; const lab = n.label.length > 25 ? n.label.slice(0, 24) + '…' : n.label;
    const g = S('g', { class:'nd' + (ctr ? ' ctr' : '') }, S('title', {}, (n.label + (n.name || n.title ? ' - ' + (n.name || n.title) : '') + (it.sub ? ' (' + it.sub + ')' : ''))),
      S('rect', { x, y, width:BW, height:BH, rx:8, fill:'var(--panel)', stroke:colour(n.kind), 'stroke-width':2 }),
      S('text', { x:x + BW / 2, y:y + (it.sub ? BH / 2 : BH / 2 + 5), 'text-anchor':'middle', style:'font-weight:' + (ctr ? 700 : 500) }, lab));
    if (it.sub) g.append(S('text', { x:x + BW / 2, y:y + BH - 6, 'text-anchor':'middle', style:'font-size:11px; fill:var(--muted)' }, it.sub.length > 30 ? it.sub.slice(0, 29) + '…' : it.sub));
    if (!ctr) g.onclick = () => open(it.id);
    return g;
  };
  const line = (x1, y1, x2, y2, dir) => S('line', Object.assign({ x1, y1, x2, y2 }, dir ? { 'marker-end':'url(#ar)' } : {}));
  const place = (arr, x, side) => { const tot = arr.length * (BH + GAP) - GAP, y0 = midY - tot / 2; arr.forEach((it, i) => { const y = y0 + i * (BH + GAP);
    if (!it.more) svg.insertBefore(side === 'left' ? line(x + BW, y + BH / 2, cx, midY, cols.dirLeft) : line(cx + BW, midY, x, y + BH / 2, cols.dirRight), svg.firstChild.nextSibling); svg.append(node(x, y, it)); }); };

}

function softwareBlock(c, n) {

function cardAIM(c, n, R) {

function cardDT(c, n, R) {

function cardStd(c, n, R) {
